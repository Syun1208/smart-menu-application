<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Lưu Vị Quán — promo (ảnh thật)</title>
<link rel="stylesheet" href="./ui.css" />
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="ui">

    <div id="scrim"></div>
    <div id="scrim-full"></div>

    <div id="bug" class="layer" style="opacity:0">
      <svg class="mark" viewBox="0 0 100 100" fill="none" stroke="#ffd9a8" stroke-width="5" stroke-linecap="round">
        <path d="M32 18v30M32 48c-8 0-12 6-12 14v20M32 18l-8 6M32 18l8 6"/>
        <ellipse cx="70" cy="32" rx="13" ry="18"/><path d="M70 50v32"/>
      </svg>
      <div class="txt">
        <div class="name">LƯU VỊ QUÁN</div>
        <div class="slogan">VỊ NGON ĐÁNG LƯU LẠI</div>
      </div>
    </div>

    <div id="hook-kicker" class="layer">ĐÓI CHƯA?</div>

    <div id="logo-lockup" class="layer" style="opacity:0">
      <svg class="mark" viewBox="0 0 100 100" fill="none" stroke="#ffd9a8" stroke-width="4" stroke-linecap="round">
        <path d="M32 14v34M32 48c-9 0-13 7-13 15v23M32 14l-9 7M32 14l9 7"/>
        <ellipse cx="70" cy="30" rx="14" ry="19"/><path d="M70 49v37"/>
      </svg>
      <div class="name">LƯU VỊ QUÁN</div>
      <div class="sub">Nem chua Trần Công Châu</div>
      <div class="rule"></div>
      <div class="tag">Vị ngon đáng lưu lại</div>
    </div>

    <div id="chapter" class="layer" style="opacity:0">
      <div class="kicker" id="ch-kicker">GIÒN RỤM</div>
      <div class="title" id="ch-title">NEM CHUA</div>
    </div>

    <div id="chips" class="layer"></div>

    <div id="cta" class="layer" style="opacity:0">
      <svg class="mark" viewBox="0 0 100 100" fill="none" stroke="#ffd9a8" stroke-width="4" stroke-linecap="round">
        <path d="M32 14v34M32 48c-9 0-13 7-13 15v23M32 14l-9 7M32 14l9 7"/>
        <ellipse cx="70" cy="30" rx="14" ry="19"/><path d="M70 49v37"/>
      </svg>
      <div class="name">LƯU VỊ QUÁN</div>
      <div class="sub">Nem chua Trần Công Châu</div>
      <div class="order"><span class="lbl">ĐẶT HÀNG</span><span class="num">0947 815 316</span></div>
      <div class="ship">Freeship bán kính 2km</div>
      <div class="hours">T2–T6: 10h–23h &nbsp;·&nbsp; T7, CN: cả ngày</div>
      <div class="tag">Vị ngon đáng lưu lại</div>
    </div>

    <div id="progress"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "/vendor/three.module.js",
    "three/addons/": "/vendor/addons/"
  }
}
</script>
<script type="module" src="./film-main.js"></script>
</body>
</html>
